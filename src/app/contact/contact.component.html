<div class="contact-container">
    <h1>Contact Us</h1>
    <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" ngModel required #name="ngModel">
        <div *ngIf="name.invalid && name.touched" class="error">Name is required.</div>
      </div>
  
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" ngModel required email #email="ngModel">
        <div *ngIf="email.invalid && email.touched" class="error">Enter a valid email address.</div>
      </div>
      <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="phone" id="phone" name="phone" ngModel required phone #phone="ngModel">
        <div *ngIf="phone.invalid && phone.touched" class="error">Enter a valid Phone number.</div>
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" ngModel required #message="ngModel"></textarea>
        <div *ngIf="message.invalid && message.touched" class="error">Message is required.</div>
      </div>
  
      <button type="submit" [disabled]="contactForm.invalid">Send Message</button>
    </form>
  </div>
